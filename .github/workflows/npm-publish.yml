# Publishes DappSentinel to npm, then installs it from npm on a fresh runner and checks a live dApp
# with it, the way a developer would. Run it by hand; it needs the NPM_TOKEN secret.
name: Publish to npm

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance: the package page links back to this run and commit

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  install-from-npm:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Kane CLI and DappSentinel from npm, in an empty folder
        run: |
          mkdir empty && cd empty
          npm install -g @testmuai/kane-cli
          for i in 1 2 3 4 5 6; do npm view dappsentinel version && break; sleep 20; done
          npm install -g dappsentinel
          dappsentinel --help | head -3
      - name: Check Lido with the npm package
        working-directory: empty
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
        run: dappsentinel check --url https://stake.lido.fi
