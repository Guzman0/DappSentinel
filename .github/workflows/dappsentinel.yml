# DappSentinel in CI: Kane CLI checks the site in a real browser on every pull request.
# The PR gets a red check while any check fails, and the report shows up in the run summary.
# When the gate fails on a pull request, Claude Code fixes the site on GitHub, commits the fix
# to the pull request, and the gate runs again. At most 3 fix rounds per pull request.
#
# Setup: add repository secrets (Settings > Secrets and variables > Actions):
#   LT_USERNAME              your TestMu AI username
#   LT_ACCESS_KEY            your TestMu AI access key
#   CLAUDE_CODE_OAUTH_TOKEN  from `claude setup-token` (only needed for the auto-fix)
#   DAPPSENTINEL_PUSH_TOKEN  optional: a fine-grained token (Contents + Pull requests: write) so the
#                            fix commit starts the pull request's checks with no approval click
name: DappSentinel

on:
  pull_request:
  workflow_dispatch:
    inputs:
      url:
        description: "Check a live dApp instead of the demo (leave empty for the demo)"
        required: false
        default: ""
      base:
        description: "Used by the auto-fix: the branch the pull request targets"
        required: false
        default: ""

jobs:
  gate:
    name: ${{ inputs.url && format('gate ({0})', inputs.url) || 'gate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      code: ${{ steps.gate.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # needed to compare the checks with the target branch

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2

      - name: Install Kane CLI and DappSentinel
        run: |
          npm install -g @testmuai/kane-cli
          npm install

      - name: Run the gate
        id: gate
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
          KANE_CLI_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          LIVE_URL: ${{ inputs.url }}
          # A re-check started by the auto-fix still compares the checks with the PR's target branch.
          DAPPSENTINEL_BASE_REF: ${{ inputs.base && format('origin/{0}', inputs.base) || '' }}
        run: |
          set +e
          if [ -n "$LIVE_URL" ]; then
            node bin/dappsentinel.js check --config profiles/live --url "$LIVE_URL"
          else
            node bin/dappsentinel.js check
          fi
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Post the report to the run summary
        if: always()
        run: cat .sentinel/report.md >> "$GITHUB_STEP_SUMMARY" || echo "No report was written." >> "$GITHUB_STEP_SUMMARY"

      # Only the masked report is kept. Kane's raw evidence (the full network recording) can hold the
      # very secrets the checks find, so it is uploaded only if you opt in with the repository variable
      # DAPPSENTINEL_KEEP_EVIDENCE=true, and then only for 3 days. Keep it off in public repos.
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dappsentinel-report
          path: |
            .sentinel/report.md
            .sentinel/report.json
          if-no-files-found: ignore

      - name: Keep Kane's raw evidence (opt-in)
        if: always() && vars.DAPPSENTINEL_KEEP_EVIDENCE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: kane-evidence-raw
          path: ~/.testmuai/kaneai/sessions/
          retention-days: 3
          if-no-files-found: ignore

      - name: Hand the report to the fixer
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-report
          path: .sentinel/report.md
          if-no-files-found: ignore

  # Kane's findings go straight to Claude Code. Only runs when checks failed (exit 1): not when the
  # gate refused to run because the rules were changed (exit 3), and not on setup errors.
  fix:
    needs: gate
    if: >-
      always() && needs.gate.outputs.code == '1' && inputs.url == '' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event_name == 'workflow_dispatch' && inputs.base != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: write
      id-token: write
    env:
      BRANCH: ${{ github.head_ref || github.ref_name }}
      BASE: ${{ github.base_ref || inputs.base }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          # A push with your own token starts the pull request's checks like any push of yours.
          # Without it, GitHub's built-in token is used and the re-check is started by hand below.
          token: ${{ secrets.DAPPSENTINEL_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Count fix rounds
        id: round
        run: |
          n=$(git log "origin/$BASE..HEAD" --grep '\[dappsentinel-fix\]' --oneline | wc -l)
          echo "n=$((n + 1))" >> "$GITHUB_OUTPUT"
          if [ "$n" -ge 3 ]; then
            echo "Stopping: Claude Code already made 3 fix rounds on this pull request." >> "$GITHUB_STEP_SUMMARY"
            echo "stop=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v8
        if: steps.round.outputs.stop != '1'
        with:
          name: gate-report
          path: gate-report

      - name: Claude Code fixes the site
        id: claude
        if: steps.round.outputs.stop != '1'
        uses: anthropics/claude-code-action@v1
        env:
          DAPPSENTINEL_HOOK: "off"     # the gate runs in CI, not inside this session
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: "--max-turns 40 --allowedTools Read,Edit,Write,Glob,Grep"
          display_report: "true"       # Claude's steps go to this run's summary, as evidence
          prompt: |
            Kane CLI checked this dApp in a real browser and DappSentinel's gate failed.
            Read gate-report/report.md for every failing check, the evidence Kane recorded, and how to fix it.

            Fix the site so every failing check passes:
            - Edit only files in demo-dapp/. It is plain HTML, CSS and JavaScript with no build step; keep it that way.
            - Never edit checks/, sentinel.config.json, bin/, lib/, hooks/, profiles/, .github/ or .claude/.
              Changing the rules doesn't count as a fix, and the gate refuses to run if they change.
            - Keep the swap flow working (checks/07-swap-flow.md).
            - Don't run Kane or the gate yourself. CI re-checks the site after you finish.
            Finish with a short list of what you changed and why.

      - name: Only the site may change
        id: guard
        if: steps.round.outputs.stop != '1'
        run: |
          rm -rf gate-report
          changed=$(git status --porcelain | awk '{print $NF}')
          if [ -z "$changed" ]; then
            # Nothing in the site needed fixing, so the failure came from somewhere else (for
            # example a Kane run that went wrong). Leave it for a human, don't commit or loop.
            echo "::notice::Claude Code found nothing to fix in the site. The failure needs a human look."
            echo "Claude Code found nothing to fix in \`demo-dapp/\`, so nothing was committed. Read the gate report above: the failure may come from the check run itself." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bad=$(echo "$changed" | grep -v '^demo-dapp/' || true)
          if [ -n "$bad" ]; then echo "::error::Refusing to commit changes outside demo-dapp/: $bad"; exit 1; fi
          echo "$changed"

      - name: Commit the fix to the pull request
        if: steps.round.outputs.stop != '1' && steps.guard.outputs.skip != '1'
        env:
          PUSH_TOKEN: ${{ secrets.DAPPSENTINEL_PUSH_TOKEN }}
        run: |
          git config user.name "DappSentinel auto-fix"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo-dapp
          git commit -m "[dappsentinel-fix] Round ${{ steps.round.outputs.n }}: fix what Kane caught" \
                     -m "Claude Code fixed the failing checks from the gate run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Only demo-dapp/ changed."
          # Push with your token when there is one (the Claude Code step resets git's login to its own).
          if [ -n "$PUSH_TOKEN" ]; then
            git push "https://x-access-token:${PUSH_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:$BRANCH"
          else
            git push origin "HEAD:$BRANCH"
          fi

      - name: Re-check with Kane
        if: steps.round.outputs.stop != '1' && steps.guard.outputs.skip != '1'
        env:
          HAS_PUSH_TOKEN: ${{ secrets.DAPPSENTINEL_PUSH_TOKEN != '' }}
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          # With DAPPSENTINEL_PUSH_TOKEN the push itself starts the pull request's gate.
          # Commits pushed with GitHub's built-in token don't, so start the gate here instead.
          if [ "$HAS_PUSH_TOKEN" != "true" ]; then
            gh workflow run dappsentinel.yml --ref "$BRANCH" -f base="$BASE"
          fi
          pr=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number')
          if [ -n "$pr" ]; then
            # Claude's own summary of its fix, redacted like every report.
            summary=$(jq -r '[.[] | select(.type == "result")] | last | .result // empty' "$EXEC_FILE" 2>/dev/null \
              | node -e 'const a=require("./lib/analyzers");const c=require("./sentinel.config.json");let t="";process.stdin.on("data",d=>t+=d).on("end",()=>process.stdout.write(a.redact(t,c)))')
            {
              echo "🛡️ **DappSentinel:** Kane's checks failed, so Claude Code fixed the site (round ${{ steps.round.outputs.n }} of 3, only \`demo-dapp/\` changed). Kane is checking again now."
              echo
              echo "[Gate run that failed and Claude's fix](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) · [The fix commit](${{ github.server_url }}/${{ github.repository }}/commit/$(git rev-parse HEAD))"
              if [ -n "$summary" ]; then echo; echo "**Claude Code's summary:**"; echo; echo "$summary"; fi
            } > comment.md
            gh pr comment "$pr" --body-file comment.md
          fi
