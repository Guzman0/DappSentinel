# Mutation test (known-answer): does DappSentinel catch mistakes it was never tuned for?
# Runs the full gate (Kane CLI in a real browser) on the fixed site and on 7 copies of it,
# each with one new mistake planted (see mutants/mutants.json). The clean site must pass
# everything; each mutant must fail exactly its own check and nothing else.
# Manual only: each variant is a full Kane run and uses TestMu AI credits.
name: Mutation test (known-answer)

on:
  workflow_dispatch:
    inputs:
      variants:
        description: Which variants to run, as a JSON list (default all)
        required: false
        default: '["clean","m1-infura-key","m2-holesky-rpc","m3-swapped-digits","m4-polygon-chain","m5-jsdelivr-script","m6-seed-in-session","m7-wrong-confirm-amount","m8-wrong-recipient","m9-hidden-amount","m10-unlimited-approval"]'
      kane_version:
        description: Kane CLI version to test with (default the latest release)
        required: false
        default: latest

jobs:
  variant:
    name: ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        id: ${{ fromJSON(inputs.variants) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2

      - name: Install Kane CLI and DappSentinel
        env:
          KANE_VERSION: ${{ inputs.kane_version }}
        run: |
          npm install -g "@testmuai/kane-cli@${KANE_VERSION:-latest}"
          npm install

      - name: Build the variant
        run: node scripts/mutants.js build ${{ matrix.id }}

      - name: Run the gate on it
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
          KANE_CLI_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node bin/dappsentinel.js check --site .mutants/${{ matrix.id }} || true

      - name: Judge the result
        run: node scripts/mutants.js judge ${{ matrix.id }}

      - name: Post the report to the run summary
        if: always()
        run: cat .sentinel/report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Collect the report, Kane's steps, screenshots and masked network log
        if: always()
        run: node scripts/collect-evidence.js ${{ matrix.id }} mutation-out/${{ matrix.id }}

      - name: Keep it
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: result-${{ matrix.id }}
          path: mutation-out/
          if-no-files-found: ignore

  # Builds the results table and commits everything the run collected to a branch of its own,
  # mutation-evidence-<run id>, so the record stays in the repository after artifacts expire.
  summary:
    needs: variant
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: actions/download-artifact@v8
        with:
          pattern: result-*
          path: collected
          merge-multiple: true
      - name: Build the results table
        run: |
          dir="evidence/mutation-test/run-${{ github.run_id }}"
          mkdir -p "$dir"
          cp -r collected/. "$dir/"
          mkdir -p verdicts
          find collected -name 'result-*.json' -exec cp {} verdicts/ \;
          node scripts/mutants.js summary verdicts
          cp verdicts/mutation-results.md "$dir/"
          cat "$dir/mutation-results.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit the record to its own branch
        run: |
          git config user.name "DappSentinel mutation test"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "mutation-evidence-${{ github.run_id }}"
          git add evidence/mutation-test
          git commit -m "Mutation test (known-answer) record, run ${{ github.run_id }}"
          git push origin "mutation-evidence-${{ github.run_id }}"
