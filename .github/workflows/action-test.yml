# Uses the published action exactly the way another repo would.
name: Action test

on:
  workflow_dispatch:
    inputs:
      url:
        description: dApp URL to check
        required: true
        default: https://stake.lido.fi

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: Guzman0/DappSentinel@v1
        with:
          url: ${{ inputs.url }}
          lt-username: ${{ secrets.LT_USERNAME }}
          lt-access-key: ${{ secrets.LT_ACCESS_KEY }}
