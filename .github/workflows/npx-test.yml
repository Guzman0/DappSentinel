# Runs DappSentinel the way a developer would try it tonight: install straight from GitHub
# and check a live dApp from an empty folder, with no clone and no config.
name: Install test

on:
  workflow_dispatch:
    inputs:
      url:
        description: dApp URL to check
        required: true
        default: https://stake.lido.fi

jobs:
  npx:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2
      - name: Install Kane CLI
        run: npm install -g @testmuai/kane-cli
      - name: Install from GitHub and check, in an empty folder
        working-directory: ${{ runner.temp }}
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
          KANE_CLI_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          URL: ${{ inputs.url }}
        run: |
          npm install -g github:Guzman0/DappSentinel#${{ github.sha }}
          dappsentinel check --url "$URL"
