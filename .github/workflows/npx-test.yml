# Runs DappSentinel the way a developer would try it tonight: one npx command in an empty
# folder, straight from GitHub, with no clone and no config.
name: npx test

on:
  workflow_dispatch:
    inputs:
      url:
        description: dApp URL to check
        required: true
        default: https://stake.lido.fi

jobs:
  npx:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2
      - name: Install Kane CLI
        run: npm install -g @testmuai/kane-cli
      - name: Which install routes work (no Kane needed)
        working-directory: ${{ runner.temp }}
        continue-on-error: true
        run: |
          npm -v
          echo "--- npx github:"; npx -y github:Guzman0/DappSentinel#${{ github.sha }} --help | head -2 || true
          echo "--- npx tarball:"; npx -y https://codeload.github.com/Guzman0/DappSentinel/tar.gz/${{ github.sha }} --help | head -2 || true
          echo "--- npm i -g github:"; npm i -g github:Guzman0/DappSentinel#${{ github.sha }} && dappsentinel --help | head -2 || true
      - name: One command, in an empty folder
        working-directory: ${{ runner.temp }}
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
          KANE_CLI_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          URL: ${{ inputs.url }}
        run: npx -y https://codeload.github.com/Guzman0/DappSentinel/tar.gz/${{ github.sha }} check --url "$URL"
